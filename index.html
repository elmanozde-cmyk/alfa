<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>İzim</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --bg: #f6f7f6; --panel: #ffffff; --panel-2: #f1f4f3; --text: #17201d; --muted: #5d6b66;
    --accent: #0f766e; --danger: #b42318; --line: #e3e7e5;
    --shadow: 0 6px 24px rgba(0,0,0,.14);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e1412; --panel:#17201d; --panel-2:#1f2a26; --text:#e8eeeb; --muted:#9aa8a3; --line:#2a3631; --shadow:0 6px 24px rgba(0,0,0,.55); --accent:#14b8a6; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow:hidden; }
  #map { position:fixed; inset:0; }

  .top { position:fixed; top:calc(env(safe-area-inset-top) + 10px); left:12px; right:12px; z-index:1000; display:flex; justify-content:center; pointer-events:none; }
  .tabs { display:flex; background:var(--panel); border-radius:999px; padding:4px; box-shadow:var(--shadow); pointer-events:auto; }
  .tabs button { border:0; background:none; color:var(--muted); padding:8px 14px; border-radius:999px; font:inherit; font-weight:600; cursor:pointer; }
  .tabs button.on { background:var(--accent); color:#fff; }

  .panel { position:fixed; left:12px; right:12px; bottom:calc(env(safe-area-inset-bottom) + 12px); z-index:1000;
    background:var(--panel); border-radius:20px; box-shadow:var(--shadow); padding:14px; max-width:520px; margin:0 auto; }
  .panel[hidden] { display:none; }
  .panel.tall { max-height:min(62vh, 640px); overflow:auto; overscroll-behavior:contain; }

  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; text-align:center; margin-bottom:10px; }
  .stats b { display:block; font-size:22px; font-variant-numeric:tabular-nums; }
  .stats span, .muted { color:var(--muted); font-size:12px; }
  .live-extra { text-align:center; font-size:13px; color:var(--muted); margin:-2px 0 10px; min-height:1.2em; }
  .live-extra b { color:var(--text); }

  .row { display:flex; gap:8px; }
  .btn { flex:1; border:0; border-radius:14px; padding:14px; font:inherit; font-weight:700; cursor:pointer; background:var(--accent); color:#fff; }
  .btn.ghost { background:transparent; color:var(--text); border:1px solid var(--line); font-weight:600; padding:11px; }
  .btn.small { padding:9px; font-size:13px; }
  .btn.danger { background:var(--danger); }
  .btn[hidden] { display:none; }
  .note { color:var(--muted); font-size:12px; margin-top:8px; text-align:center; min-height:1em; }

  h3 { margin:14px 0 8px; font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:700; }
  h3:first-child { margin-top:0; }

  /* Keşif */
  .tiles { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .tile { background:var(--panel-2); border-radius:12px; padding:9px 10px; }
  .tile b { display:block; font-size:19px; font-variant-numeric:tabular-nums; }
  .tile span { color:var(--muted); font-size:12px; }
  .legend { display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin-top:10px; }
  .legend i { display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:-2px; margin-right:4px; }
  .hot { display:flex; align-items:center; gap:10px; padding:8px 4px; border-bottom:1px solid var(--line); cursor:pointer; }
  .hot:last-child { border-bottom:0; }
  .hot .n { font-weight:700; font-variant-numeric:tabular-nums; min-width:22px; text-align:center; color:var(--muted); }
  .hot .meta { flex:1; min-width:0; }
  .hot .meta div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* Günlük */
  .tiles.four { grid-template-columns:repeat(4,1fr); }
  .tiles.four .tile b { font-size:17px; }
  .chart { position:relative; margin-top:4px; }
  .chart svg { display:block; width:100%; height:auto; overflow:visible; }
  .chart .tip { position:absolute; top:-6px; transform:translate(-50%,-100%); background:var(--text); color:var(--panel);
    font-size:12px; padding:4px 8px; border-radius:8px; white-space:nowrap; pointer-events:none; }
  .chart .tip[hidden] { display:none; }
  .day { border:1px solid var(--line); border-radius:14px; margin-bottom:8px; overflow:hidden; }
  .day.on { border-color:var(--accent); }
  .day-head { padding:10px 12px; cursor:pointer; }
  .day-head .l1 { display:flex; justify-content:space-between; gap:8px; font-weight:700; }
  .day-head .l2 { color:var(--muted); font-size:13px; margin-top:2px; }
  .day-head .l3 { font-size:13px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .day-walks { border-top:1px solid var(--line); background:var(--panel-2); }
  .walk { display:flex; align-items:center; gap:8px; padding:9px 12px; border-bottom:1px solid var(--line); font-size:13px; }
  .walk:last-child { border-bottom:0; }
  .walk .meta { flex:1; min-width:0; }
  .walk .meta small { color:var(--muted); }
  .walk button { border:0; background:none; color:var(--muted); font-size:16px; cursor:pointer; padding:4px 6px; }
  .badge { display:inline-block; font-size:11px; font-weight:700; padding:1px 7px; border-radius:999px; background:color-mix(in srgb, var(--accent) 16%, transparent); color:var(--accent); margin-left:4px; }
  .empty { color:var(--muted); text-align:center; padding:18px 0; }

  .me { width:18px; height:18px; border-radius:50%; background:#2563eb; border:3px solid #fff; box-shadow:0 0 0 2px rgba(37,99,235,.35); }
  .leaflet-control-attribution { font-size:10px; }
  .leaflet-popup-content { margin:10px 12px; font-size:13px; line-height:1.45; }
  .leaflet-popup-content b { font-size:15px; }
  .fog-pane { pointer-events:none; }
</style>
</head>
<body>
<div id="map"></div>

<div class="top">
  <div class="tabs">
    <button data-tab="walk" class="on">Yürüyüş</button>
    <button data-tab="explore">Keşif</button>
    <button data-tab="daily">Günlük</button>
  </div>
</div>

<!-- Yürüyüş -->
<div class="panel" id="p-walk">
  <div class="stats">
    <div><b id="sDist">0.00</b><span>km</span></div>
    <div><b id="sTime">00:00</b><span>süre</span></div>
    <div><b id="sPace">–</b><span>dk/km</span></div>
  </div>
  <div class="live-extra" id="liveExtra"></div>
  <div class="row">
    <button class="btn" id="bStart">Yürüyüşe başla</button>
    <button class="btn ghost" id="bPause" hidden>Duraklat</button>
    <button class="btn danger" id="bStop" hidden>Bitir ve kaydet</button>
  </div>
  <div class="note" id="note"></div>
</div>

<!-- Keşif -->
<div class="panel" id="p-explore" hidden>
  <div class="tiles">
    <div class="tile"><b id="eArea">0</b><span>km² keşfedildi</span></div>
    <div class="tile"><b id="eCells">0</b><span>farklı nokta</span></div>
    <div class="tile"><b id="eView">–</b><span>bu ekranın</span></div>
  </div>
  <div class="legend" id="legend"></div>
  <h3>En çok gittiğin yerler</h3>
  <div id="hots"></div>
  <div class="muted" style="margin-top:8px;text-align:center">Haritada bir yere dokun: oradan kaç kez geçtiğini gör.</div>
</div>

<!-- Günlük -->
<div class="panel tall" id="p-daily" hidden>
  <div class="tiles four">
    <div class="tile"><b id="dWeek">0</b><span>bu hafta km</span></div>
    <div class="tile"><b id="dMonth">0</b><span>bu ay km</span></div>
    <div class="tile"><b id="dTotal">0</b><span>toplam km</span></div>
    <div class="tile"><b id="dStreak">0</b><span>gün seri</span></div>
  </div>
  <h3>Son 14 gün · km</h3>
  <div class="chart" id="chart"><div class="tip" id="tip" hidden></div></div>
  <h3>Gün gün</h3>
  <div id="days"></div>
  <div class="row" style="margin-top:10px">
    <button class="btn ghost small" id="bExport">Yedekle</button>
    <button class="btn ghost small" id="bImport">Geri yükle</button>
  </div>
  <input type="file" id="fileIn" accept=".json,application/json" hidden>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="app.js?v=3"></script>
</body>
</html>
