name: Supabase fonksiyonlarını yayınla

on:
  push:
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ihvzwkpnhihmbzdvljvf
    steps:
      - uses: actions/checkout@v4

      - name: Anahtar var mı?
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN tanımlı değil; yayınlama atlandı."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.skip != 'true'
        with:
          version: latest

      - name: Fonksiyonları yayınla
        if: steps.check.outputs.skip != 'true'
        run: |
          supabase functions deploy polar --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy polar-callback --project-ref "$PROJECT_REF" --no-verify-jwt
