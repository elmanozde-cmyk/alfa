name: Testler

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıklar
        run: npm ci

      - name: Tarayıcı
        run: npx playwright install --with-deps chromium

      - name: Birim testleri (sis, GPX/TCX)
        run: npm run test:unit

      - name: Uçtan uca testler
        run: npm run test:e2e

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Polar sunucu fonksiyonu testi
        run: deno run --allow-read tests/unit/polar.test.ts
