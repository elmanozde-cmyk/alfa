<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>İzim</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --bg: #f6f7f6; --panel: #ffffff; --text: #17201d; --muted: #5d6b66;
    --accent: #0f766e; --accent-2: #14b8a6; --danger: #b42318; --line: #e3e7e5;
    --shadow: 0 6px 24px rgba(0,0,0,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e1412; --panel:#17201d; --text:#e8eeeb; --muted:#9aa8a3; --line:#26312d; --shadow:0 6px 24px rgba(0,0,0,.5); }
  }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #map { position:fixed; inset:0; }
  .top { position:fixed; top:calc(env(safe-area-inset-top) + 10px); left:12px; right:12px; z-index:1000;
    display:flex; gap:8px; justify-content:center; }
  .tabs { display:flex; background:var(--panel); border-radius:999px; padding:4px; box-shadow:var(--shadow); }
  .tabs button { border:0; background:none; color:var(--muted); padding:8px 16px; border-radius:999px; font:inherit; font-weight:600; cursor:pointer; }
  .tabs button.on { background:var(--accent); color:#fff; }
  .panel { position:fixed; left:12px; right:12px; bottom:calc(env(safe-area-inset-bottom) + 12px); z-index:1000;
    background:var(--panel); border-radius:20px; box-shadow:var(--shadow); padding:14px; max-width:520px; margin:0 auto; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; text-align:center; margin-bottom:12px; }
  .stats b { display:block; font-size:22px; font-variant-numeric:tabular-nums; }
  .stats span { color:var(--muted); font-size:12px; }
  .row { display:flex; gap:8px; }
  .btn { flex:1; border:0; border-radius:14px; padding:14px; font:inherit; font-weight:700; cursor:pointer;
    background:var(--accent); color:#fff; }
  .btn.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
  .btn.danger { background:var(--danger); }
  .btn[hidden] { display:none; }
  .note { color:var(--muted); font-size:12px; margin-top:8px; text-align:center; min-height:1em; }
  .list { max-height:42vh; overflow:auto; margin:-4px -4px 8px; }
  .item { display:flex; align-items:center; gap:10px; padding:10px 6px; border-bottom:1px solid var(--line); cursor:pointer; }
  .item:last-child { border-bottom:0; }
  .item .dot { width:12px; height:12px; border-radius:50%; flex:none; }
  .item .meta { flex:1; min-width:0; }
  .item .meta small { color:var(--muted); }
  .item button { border:0; background:none; color:var(--muted); font-size:18px; cursor:pointer; padding:4px 8px; }
  .summary { display:flex; justify-content:space-between; color:var(--muted); font-size:13px; margin-bottom:8px; }
  .summary b { color:var(--text); }
  .empty { color:var(--muted); text-align:center; padding:18px 0; }
  .leaflet-control-attribution { font-size:10px; }
  .me { width:18px; height:18px; border-radius:50%; background:#2563eb; border:3px solid #fff; box-shadow:0 0 0 2px rgba(37,99,235,.35); }
</style>
</head>
<body>
<div id="map"></div>

<div class="top">
  <div class="tabs">
    <button id="tabWalk" class="on">Yürüyüş</button>
    <button id="tabMap">Haritam</button>
  </div>
</div>

<!-- Yürüyüş paneli -->
<div class="panel" id="walkPanel">
  <div class="stats">
    <div><b id="sDist">0.00</b><span>km</span></div>
    <div><b id="sTime">00:00</b><span>süre</span></div>
    <div><b id="sPace">–</b><span>dk/km</span></div>
  </div>
  <div class="row">
    <button class="btn" id="bStart">Yürüyüşe başla</button>
    <button class="btn ghost" id="bPause" hidden>Duraklat</button>
    <button class="btn danger" id="bStop" hidden>Bitir ve kaydet</button>
  </div>
  <div class="note" id="note"></div>
</div>

<!-- Haritam paneli -->
<div class="panel" id="mapPanel" hidden>
  <div class="summary">
    <div><b id="tCount">0</b> yürüyüş</div>
    <div>Toplam <b id="tDist">0</b> km</div>
  </div>
  <div class="list" id="list"></div>
  <div class="row">
    <button class="btn ghost" id="bAll">Tümünü göster</button>
    <button class="btn ghost" id="bExport">Yedekle</button>
    <button class="btn ghost" id="bImport">Geri yükle</button>
  </div>
  <input type="file" id="fileIn" accept=".json,application/json" hidden>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="app.js"></script>
</body>
</html>
